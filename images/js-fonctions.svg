<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500"><rect width="1200" height="500" fill="#dcfce7"/><text x="60" y="82" font-size="42" fill="#166534" font-weight="700" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" xml:space="preserve">Fonctions JavaScript</text><g transform="translate(60,120)"><rect x="0" y="0" width="560" height="340" rx="14" fill="#172033"/><circle cx="26" cy="22" r="6" fill="#f87171"/><circle cx="48" cy="22" r="6" fill="#fbbf24"/><circle cx="70" cy="22" r="6" fill="#4ade80"/><g transform="translate(0,40)"><text x="30" y="62" font-size="19" fill="#e2e8f0" font-weight="400" text-anchor="start" font-family="Consolas, Menlo, monospace" xml:space="preserve">function somme(a, b) {</text><text x="30" y="98" font-size="19" fill="#e2e8f0" font-weight="400" text-anchor="start" font-family="Consolas, Menlo, monospace" xml:space="preserve">  return a + b;</text><text x="30" y="134" font-size="19" fill="#e2e8f0" font-weight="400" text-anchor="start" font-family="Consolas, Menlo, monospace" xml:space="preserve">}</text><text x="30" y="170" font-size="19" fill="#e2e8f0" font-weight="400" text-anchor="start" font-family="Consolas, Menlo, monospace" xml:space="preserve">somme(3, 4); // 7</text></g></g><g transform="translate(660,120)"><rect x="0" y="0" width="480" height="340" rx="14" fill="#ffffffcc"/><g transform="translate(0,10)"><rect x="20" y="40" width="90" height="60" rx="8" fill="#e2e8f0"/><text x="65" y="78" font-size="20" fill="#111" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, monospace" xml:space="preserve">a = 3</text><rect x="20" y="120" width="90" height="60" rx="8" fill="#e2e8f0"/><text x="65" y="158" font-size="20" fill="#111" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, monospace" xml:space="preserve">b = 4</text><line x1="115" y1="70" x2="175" y2="120" stroke="#64748b" stroke-width="3"/><polygon points="175,120 165,113 165,127" fill="#64748b"/><