<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500"><rect width="1200" height="500" fill="#fef3c7"/><text x="60" y="82" font-size="42" fill="#92400e" font-weight="700" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" xml:space="preserve">Boucles et tableaux</text><g transform="translate(60,120)"><rect x="0" y="0" width="560" height="340" rx="14" fill="#172033"/><circle cx="26" cy="22" r="6" fill="#f87171"/><circle cx="48" cy="22" r="6" fill="#fbbf24"/><circle cx="70" cy="22" r="6" fill="#4ade80"/><g transform="translate(0,40)"><text x="30" y="62" font-size="19" fill="#e2e8f0" font-weight="400" text-anchor="start" font-family="Consolas, Menlo, monospace" xml:space="preserve">const notes = [12, 15, 9, 17];</text><text x="30" y="98" font-size="19" fill="#e2e8f0" font-weight="400" text-anchor="start" font-family="Consolas, Menlo, monospace" xml:space="preserve">let total = 0;</text><text x="30" y="134" font-size="19" fill="#e2e8f0" font-weight="400" text-anchor="start" font-family="Consolas, Menlo, monospace" xml:space="preserve">for (const n of notes) {</text><text x="30" y="170" font-size="19" fill="#e2e8f0" font-weight="400" text-anchor="start" font-family="Consolas, Menlo, monospace" xml:space="preserve">  total += n;</text><text x="30" y="206" font-size="19" fill="#e2e8f0" font-weight="400" text-anchor="start" font-family="Consolas, Menlo, monospace" xml:space="preserve">}</text></g></g><g transform="translate(660,120)"><rect x="0" y="0" width="480" height="340" rx="14" fill="#ffffffcc"/><g transform="translate(0,10)"><rect x="30" y="60" width="90" height="70" rx="8" fill="#fff" stroke="#92400e" stroke-width="3"/><text x="75" y="105" font-size="30" fill="#111" font-weight="700" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" xml:space="preserve">12</text><text x="75" y="150" font-size="15" fill="#64748b" font-weight="400" text-anchor="middle" font-family="Consolas, Menlo, monospace" xml:space="preserve">[0]</text><rect x="135" y="60" width="90" height="70" rx="8" fill="#fff" stroke="#92400e" stroke-width="3"/><text x="180" y="105" font-size="30" fill="#111" font-weight="700" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" xml:space="preserve">15</text><text x="180" y="150" font-size="15" fill="#64748b" font-weight="400" text-anchor="middle" font-family="Consolas, Menlo, monospace" xml:space="preserve">[1]</text><rect x="240" y="60" width="90" height="70" rx="8" fill="#fff" stroke="#92400e" stroke-width="3"/><text x="285" y="105" font-size="30" fill="#111" font-weight="700" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" xml:space="preserve">9</text><text x="285" y="150" font-size="15" fill="#64748b" font-weight="400" text-anchor="middle" font-family="Consolas, Menlo, monospace" xml:space="preserve">[2]</text><rect x="345" y="60" width="90" height="70" rx="8" fill="#fff" stroke="#92400e" stroke-width="3"/><text x="390" y="105" font-size="30" fill="#111" font-weight="700" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" xml:space="preserve">17</text><text x="390" y="150" font-size="15" fill="#64748b" font-weight="400" text-anchor="middle" font-family="Consolas, Menlo, monospace" xml:space="preserve">[3]</text><path d="M 75 55 Q 240 15 405 55" fill="none" stroke="#92400e" stroke-width="3" stroke-dasharray="8 6"/><text x="240" y="22" font-size="15" fill="#92400e" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, monospace" xml:space="preserve">for…of</text><rect x="130" y="200" width="220" height="70" rx="10" fill="#92400e"/><text x="240" y="245" font-size="26" fill="#fff" font-weight="700" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" xml:space="preserve">total = 53</text></g></g></svg>