<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="LearnHub, votre plateforme de cours en ligne (mini LMS)."
    />
    <title>LearnHub - Accueil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/lms.css" />
    <!-- Scripts classiques, dans l'ordre de dépendance (pas de bibliothèque externe) -->
    <script src="js/data.js" defer></script>
    <script src="js/utils.js" defer></script>
    <script src="js/store.js" defer></script>
    <script src="js/quiz.js" defer></script>
    <script src="js/player.js" defer></script>
    <script src="js/admin.js" defer></script>
    <script src="js/main.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#app">Aller au contenu</a>
    <header class="site-header">
      <div class="container header-content">
        <a class="logo" href="#/">LearnHub</a>
        <button
          class="menu-toggle"
          type="button"
          aria-label="Ouvrir le menu"
          aria-expanded="false"
          aria-controls="site-nav"
        >
          <span class="menu-icon" aria-hidden="true"
            ><span></span><span></span><span></span
          ></span>
        </button>
        <nav class="site-nav" id="site-nav" aria-label="Navigation principale">
          <ul>
            <li><a href="#/" data-route="home">Accueil</a></li>
            <li><a href="#/cours" data-route="cours">Cours</a></li>
            <li><a href="#/admin" data-route="admin">Administration</a></li>
            <li><a href="#/contact" data-route="contact">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- Le contenu de chaque vue est injecté ici par js/main.js (SPA) -->
    <main id="app" tabindex="-1">
      <noscript
        ><p class="container">
          JavaScript est nécessaire pour utiliser LearnHub.
        </p></noscript
      >
    </main>
    <p
      class="visually-hidden"
      id="announcer"
      role="status"
      aria-live="polite"
    ></p>

    <footer class="site-footer" id="contact">
      <div class="container">
        <p>
          &copy; 2026 LearnHub. Tous droits réservés. · contact@learnhub.example
        </p>
      </div>
    </footer>
  </body>
</html>
